<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Parent Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    :root { --primary: #667eea; --primary-dark: #764ba2; --green: #22c55e; --gold: #fbbf24; --red: #ef4444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6; color: #1a1a2e; min-height: 100vh;
    }

    /* ===== PIN GATE ===== */
    #pinGate {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    .pin-card {
      background: white; border-radius: 20px; padding: 32px;
      max-width: 340px; width: 100%; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .pin-card h2 { font-size: 22px; margin-bottom: 6px; }
    .pin-card p { color: #888; font-size: 13px; margin-bottom: 20px; }
    .pin-dots {
      display: flex; gap: 12px; justify-content: center; margin-bottom: 20px;
    }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid #ccc; transition: all 0.2s;
    }
    .pin-dot.filled { background: var(--primary); border-color: var(--primary); }
    .pin-dot.error { background: var(--red); border-color: var(--red); }
    .pin-pad {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
      max-width: 240px; margin: 0 auto;
    }
    .pin-key {
      background: #f3f4f6; border: none; border-radius: 12px;
      padding: 14px; font-size: 20px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-key:active { background: #e5e7eb; }
    .pin-key.back { font-size: 16px; color: #888; }
    .pin-error { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }

    /* ===== DASHBOARD ===== */
    #dashboard { display: none; }
    .dash-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 20px 20px 24px;
    }
    .dash-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .dash-header h1 { font-size: 22px; }
    .dash-back { color: white; text-decoration: none; font-size: 14px; opacity: 0.8; }
    .stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
    .stat-box {
      background: rgba(255,255,255,0.15); border-radius: 12px;
      padding: 10px 8px; text-align: center;
    }
    .stat-val { font-size: 22px; font-weight: 800; }
    .stat-label { font-size: 10px; opacity: 0.8; margin-top: 2px; }

    .section {
      background: white; margin: 16px; border-radius: 16px;
      padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .section h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #333; }

    /* Chart */
    .chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .chart-scroll::-webkit-scrollbar { display: none; }
    .chart-row { display: flex; gap: 3px; align-items: flex-end; min-width: max-content; height: 120px; }
    .chart-bar-wrap { display: flex; flex-direction: column; align-items: center; width: 22px; }
    .chart-bar {
      width: 16px; border-radius: 4px 4px 0 0; min-height: 2px;
      transition: height 0.3s;
    }
    .chart-day { font-size: 8px; color: #999; margin-top: 3px; }

    /* Chore Manager */
    .chore-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid #f0f0f0;
    }
    .chore-row:last-child { border-bottom: none; }
    .chore-row-icon { font-size: 24px; }
    .chore-row-info { flex: 1; }
    .chore-row-title { font-size: 14px; font-weight: 600; }
    .chore-row-sub { font-size: 11px; color: #999; }
    .chore-row-actions { display: flex; gap: 6px; }
    .btn-sm {
      padding: 4px 10px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-edit { background: #e0e7ff; color: var(--primary); }
    .btn-del { background: #fee2e2; color: var(--red); }
    .btn-add {
      background: var(--primary); color: white; border: none;
      border-radius: 10px; padding: 10px 20px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      margin-top: 12px;
    }

    /* Form Modal */
    .form-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 100;
      align-items: center; justify-content: center; padding: 20px;
    }
    .form-overlay.visible { display: flex; }
    .form-card {
      background: white; border-radius: 20px; padding: 24px;
      max-width: 380px; width: 100%;
    }
    .form-card h3 { margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px; border: 2px solid #e5e7eb;
      border-radius: 10px; font-size: 14px; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
    .form-actions { display: flex; gap: 8px; margin-top: 16px; }
    .form-actions button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #f3f4f6; color: #666; }
    .btn-save { background: var(--primary); color: white; }

    /* Goals */
    .goal-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid #f0f0f0;
    }
    .goal-item:last-child { border-bottom: none; }
    .goal-status { font-size: 18px; }
    .goal-text { font-size: 14px; flex: 1; }
    .goal-empty { color: #999; font-size: 13px; }

    /* Settings */
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid #f0f0f0;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 14px; font-weight: 600; }
    .setting-val { font-size: 14px; color: #666; }
    .setting-input {
      padding: 6px 10px; border: 2px solid #e5e7eb; border-radius: 8px;
      font-size: 14px; outline: none; width: 160px; text-align: right;
    }
    .setting-input:focus { border-color: var(--primary); }
    .btn-settings-save {
      background: var(--primary); color: white; border: none;
      border-radius: 10px; padding: 10px 20px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      margin-top: 14px; width: 100%;
    }
  </style>
</head>
<body>

  <!-- PIN GATE -->
  <div id="pinGate">
    <div class="pin-card">
      <h2 id="pinTitle">Enter PIN</h2>
      <p id="pinSubtitle">Enter your 4-digit parent PIN</p>
      <div class="pin-dots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div class="pin-pad">
        <button class="pin-key" onclick="pinPress('1')">1</button>
        <button class="pin-key" onclick="pinPress('2')">2</button>
        <button class="pin-key" onclick="pinPress('3')">3</button>
        <button class="pin-key" onclick="pinPress('4')">4</button>
        <button class="pin-key" onclick="pinPress('5')">5</button>
        <button class="pin-key" onclick="pinPress('6')">6</button>
        <button class="pin-key" onclick="pinPress('7')">7</button>
        <button class="pin-key" onclick="pinPress('8')">8</button>
        <button class="pin-key" onclick="pinPress('9')">9</button>
        <button class="pin-key" disabled></button>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key back" onclick="pinBack()">&#9003;</button>
      </div>
      <div class="pin-error" id="pinError">Wrong PIN. Try again.</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="dash-header">
      <div class="dash-header-top">
        <h1>Parent Dashboard</h1>
        <a id="kidAppLink" href="app.html" class="dash-back">&larr; Kid App</a>
      </div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val" id="statStreak">0</div>
          <div class="stat-label">Streak</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statXP">0</div>
          <div class="stat-label">Total XP</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statLevel">1</div>
          <div class="stat-label">Level</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat7Day">0%</div>
          <div class="stat-label">7-Day</div>
        </div>
      </div>
    </div>

    <!-- 30-Day Chart -->
    <div class="section">
      <h3>Last 30 Days</h3>
      <div class="chart-scroll"><div class="chart-row" id="chartRow"></div></div>
    </div>

    <!-- Chore Manager -->
    <div class="section">
      <h3>Manage Chores</h3>
      <div id="choreManager"></div>
      <button class="btn-add" onclick="openChoreForm()">+ Add Chore</button>
    </div>

    <!-- Goals -->
    <div class="section">
      <h3>Goals</h3>
      <div id="goalsContainer"><div class="goal-empty">No goals set yet.</div></div>
    </div>

    <!-- Settings -->
    <div class="section">
      <h3>Settings</h3>
      <div class="setting-row">
        <span class="setting-label">Child's Name</span>
        <input class="setting-input" id="settingName" placeholder="Name">
      </div>
      <div class="setting-row">
        <span class="setting-label">XP per Chore</span>
        <input class="setting-input" id="settingXP" type="number" value="10" min="1" max="100">
      </div>
      <div class="setting-row">
        <span class="setting-label">Change PIN</span>
        <input class="setting-input" id="settingPIN" type="password" placeholder="New 4-digit PIN" maxlength="4">
      </div>
      <button class="btn-settings-save" onclick="saveSettings()">Save Settings</button>
    </div>

    <div style="height:40px;"></div>
  </div>

  <!-- Chore Form Modal -->
  <div class="form-overlay" id="choreFormOverlay">
    <div class="form-card">
      <h3 id="choreFormTitle">Add Chore</h3>
      <div class="form-group">
        <label>Title</label>
        <input id="cfTitle" placeholder="e.g. Make the Bed">
      </div>
      <div class="form-group">
        <label>Subtitle</label>
        <input id="cfSub" placeholder="e.g. Nice and tidy!">
      </div>
      <div class="form-group">
        <label>Icon (emoji)</label>
        <input id="cfIcon" placeholder="e.g. 🛏️" maxlength="4">
      </div>
      <div class="form-group">
        <label>XP Value</label>
        <input id="cfXP" type="number" value="10" min="1" max="100">
      </div>
      <input type="hidden" id="cfEditId">
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeChoreForm()">Cancel</button>
        <button class="btn-save" onclick="saveChore()">Save</button>
      </div>
    </div>
  </div>

<script>
// =============================================================
// FAMILY ID HELPER — Multi-family support
// =============================================================
function getFamilyId() {
  const params = new URLSearchParams(window.location.search);
  let fid = params.get('f');
  if (fid) {
    localStorage.setItem('familyId', fid);
    return fid;
  }
  fid = localStorage.getItem('familyId');
  if (fid) return fid;
  window.location.href = 'index.html';
  return null;
}

const familyId = getFamilyId();

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyC08HJ3Q8yitpJyTG28nhrWhZBv2s3YDwE",
  authDomain: "morning-chores-ee2f3.firebaseapp.com",
  projectId: "morning-chores-ee2f3",
  storageBucket: "morning-chores-ee2f3.firebasestorage.app",
  messagingSenderId: "374643848407",
  appId: "1:374643848407:web:642a57af25f97f037cec92"
};

let db, familyRef;
let familyData = {};
let profile = {};
let chores = [];
let pinMode = 'enter';
let pinBuffer = '';
let pinFirst = '';

// ===== INIT =====
async function init() {
  if (!familyId) return;
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  familyRef = db.collection('families').doc(familyId);
  try { await db.enablePersistence(); } catch(e) {}

  const famDoc = await familyRef.get();
  if (!famDoc.exists) {
    localStorage.removeItem('familyId');
    window.location.href = 'index.html';
    return;
  }
  familyData = famDoc.data();

  // Update kid app link
  document.getElementById('kidAppLink').href = 'app.html?f=' + familyId;

  if (!familyData.pinHash) {
    pinMode = 'create';
    document.getElementById('pinTitle').textContent = 'Create a PIN';
    document.getElementById('pinSubtitle').textContent = 'Choose a 4-digit parent PIN';
  }
}

// ===== PIN =====
async function hashPin(pin) {
  const data = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('d' + i);
    dot.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
  }
}

function pinPress(digit) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updateDots();
  if (pinBuffer.length === 4) setTimeout(submitPin, 200);
}

function pinBack() {
  pinBuffer = pinBuffer.slice(0, -1);
  updateDots();
  document.getElementById('pinError').style.display = 'none';
}

async function submitPin() {
  const hash = await hashPin(pinBuffer);

  if (pinMode === 'create') {
    pinFirst = pinBuffer;
    pinBuffer = '';
    pinMode = 'confirm';
    document.getElementById('pinTitle').textContent = 'Confirm PIN';
    document.getElementById('pinSubtitle').textContent = 'Enter the same PIN again';
    updateDots();
    return;
  }

  if (pinMode === 'confirm') {
    if (pinBuffer === pinFirst) {
      familyData.pinHash = hash;
      await familyRef.update({ pinHash: hash });
      showDashboard();
    } else {
      showPinError("PINs didn't match. Try again.");
      pinMode = 'create';
      document.getElementById('pinTitle').textContent = 'Create a PIN';
      document.getElementById('pinSubtitle').textContent = 'Choose a 4-digit parent PIN';
      pinBuffer = '';
      updateDots();
    }
    return;
  }

  // enter mode
  if (hash === familyData.pinHash) {
    showDashboard();
  } else {
    showPinError('Wrong PIN. Try again.');
    pinBuffer = '';
    updateDots();
  }
}

function showPinError(msg) {
  const el = document.getElementById('pinError');
  el.textContent = msg;
  el.style.display = 'block';
  for (let i = 0; i < 4; i++) document.getElementById('d' + i).classList.add('error');
  setTimeout(() => {
    for (let i = 0; i < 4; i++) document.getElementById('d' + i).classList.remove('error');
  }, 600);
}

// ===== DASHBOARD =====
async function showDashboard() {
  document.getElementById('pinGate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  await loadDashData();
}

async function loadDashData() {
  // Profile
  const pDoc = await familyRef.collection('profile').doc('main').get();
  profile = pDoc.exists ? pDoc.data() : { xp: 0, streak: 0, badges: [] };

  // Refresh family data
  const famDoc = await familyRef.get();
  if (famDoc.exists) familyData = famDoc.data();

  // Chores
  const cSnap = await familyRef.collection('chores').orderBy('order').get();
  chores = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  // 30-day completions
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push(d.toISOString().split('T')[0]);
  }
  const completions = {};
  for (const day of days) {
    const doc = await familyRef.collection('completions').doc(day).get();
    completions[day] = doc.exists ? doc.data() : null;
  }

  // Goals
  const gSnap = await familyRef.collection('goals').orderBy('createdAt', 'desc').get();
  const goals = gSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  renderStats(completions, days);
  renderChart(completions, days);
  renderChoreManager();
  renderGoals(goals);
  populateSettings();
}

function renderStats(completions, days) {
  const LEVELS = [
    { level:1,xp:0 },{level:2,xp:50},{level:3,xp:150},{level:4,xp:300},{level:5,xp:500},
    {level:6,xp:750},{level:7,xp:1050},{level:8,xp:1400},{level:9,xp:1800},{level:10,xp:2300},
  ];
  let lvl = 1;
  for (let i = LEVELS.length-1; i >= 0; i--) { if ((profile.xp||0) >= LEVELS[i].xp) { lvl = LEVELS[i].level; break; } }

  document.getElementById('statStreak').textContent = profile.streak || 0;
  document.getElementById('statXP').textContent = profile.xp || 0;
  document.getElementById('statLevel').textContent = lvl;

  const last7 = days.slice(-7);
  let totalPct = 0, counted = 0;
  const activeCount = chores.filter(c => c.active !== false).length || 1;
  last7.forEach(d => {
    const c = completions[d];
    if (c && c.done) { totalPct += (c.done.length / activeCount) * 100; counted++; }
  });
  document.getElementById('stat7Day').textContent = counted > 0 ? Math.round(totalPct / 7) + '%' : '0%';
}

function renderChart(completions, days) {
  const row = document.getElementById('chartRow');
  row.innerHTML = '';
  const activeCount = chores.filter(c => c.active !== false).length || 1;

  days.forEach(day => {
    const c = completions[day];
    const done = c && c.done ? c.done.length : 0;
    const pct = Math.round((done / activeCount) * 100);
    const h = Math.max(2, (pct / 100) * 100);
    let color = '#e5e7eb';
    if (pct === 100) color = '#22c55e';
    else if (pct > 0) color = '#fbbf24';

    const wrap = document.createElement('div');
    wrap.className = 'chart-bar-wrap';
    const bar = document.createElement('div');
    bar.className = 'chart-bar';
    bar.style.height = h + 'px';
    bar.style.background = color;
    bar.title = day + ': ' + pct + '%';
    const label = document.createElement('div');
    label.className = 'chart-day';
    label.textContent = parseInt(day.split('-')[2]);
    wrap.appendChild(bar);
    wrap.appendChild(label);
    row.appendChild(wrap);
  });
}

function renderChoreManager() {
  const el = document.getElementById('choreManager');
  if (chores.length === 0) { el.innerHTML = '<p style="color:#999;font-size:13px;">No chores yet.</p>'; return; }
  el.innerHTML = chores.map(c =>
    '<div class="chore-row">' +
    '<div class="chore-row-icon">' + (c.icon || '📋') + '</div>' +
    '<div class="chore-row-info"><div class="chore-row-title">' + c.title + '</div>' +
    '<div class="chore-row-sub">' + (c.subtitle || '') + ' &middot; ' + (c.xp||10) + ' XP</div></div>' +
    '<div class="chore-row-actions">' +
    '<button class="btn-sm btn-edit" onclick="editChore(\'' + c.id + '\')">Edit</button>' +
    '<button class="btn-sm btn-del" onclick="deleteChore(\'' + c.id + '\')">Del</button>' +
    '</div></div>'
  ).join('');
}

function renderGoals(goals) {
  const el = document.getElementById('goalsContainer');
  if (!goals || goals.length === 0) { el.innerHTML = '<div class="goal-empty">No goals set yet.</div>'; return; }
  el.innerHTML = goals.map(g =>
    '<div class="goal-item">' +
    '<div class="goal-status">' + (g.completed ? '✅' : '🎯') + '</div>' +
    '<div class="goal-text">' + g.text + '</div></div>'
  ).join('');
}

function populateSettings() {
  document.getElementById('settingName').value = familyData.childName || '';
  document.getElementById('settingXP').value = familyData.xpPerChore || 10;
}

// ===== CHORE CRUD =====
function openChoreForm(editId) {
  document.getElementById('cfEditId').value = editId || '';
  if (editId) {
    const c = chores.find(x => x.id === editId);
    if (!c) return;
    document.getElementById('choreFormTitle').textContent = 'Edit Chore';
    document.getElementById('cfTitle').value = c.title || '';
    document.getElementById('cfSub').value = c.subtitle || '';
    document.getElementById('cfIcon').value = c.icon || '';
    document.getElementById('cfXP').value = c.xp || 10;
  } else {
    document.getElementById('choreFormTitle').textContent = 'Add Chore';
    document.getElementById('cfTitle').value = '';
    document.getElementById('cfSub').value = '';
    document.getElementById('cfIcon').value = '';
    document.getElementById('cfXP').value = 10;
  }
  document.getElementById('choreFormOverlay').classList.add('visible');
}

function editChore(id) { openChoreForm(id); }

function closeChoreForm() { document.getElementById('choreFormOverlay').classList.remove('visible'); }

async function saveChore() {
  const editId = document.getElementById('cfEditId').value;
  const data = {
    title: document.getElementById('cfTitle').value.trim(),
    subtitle: document.getElementById('cfSub').value.trim(),
    icon: document.getElementById('cfIcon').value.trim() || '📋',
    xp: parseInt(document.getElementById('cfXP').value) || 10,
    active: true,
  };
  if (!data.title) return;

  if (editId) {
    await familyRef.collection('chores').doc(editId).update(data);
  } else {
    data.order = chores.length + 1;
    await familyRef.collection('chores').doc().set(data);
  }
  closeChoreForm();
  await loadDashData();
}

async function deleteChore(id) {
  if (!confirm('Remove this chore?')) return;
  await familyRef.collection('chores').doc(id).delete();
  await loadDashData();
}

// ===== SETTINGS =====
async function saveSettings() {
  const updates = {
    childName: document.getElementById('settingName').value.trim(),
    xpPerChore: parseInt(document.getElementById('settingXP').value) || 10,
  };
  const newPin = document.getElementById('settingPIN').value.trim();
  if (newPin && newPin.length === 4) {
    updates.pinHash = await hashPin(newPin);
  }
  await familyRef.update(updates);
  familyData = { ...familyData, ...updates };
  document.getElementById('settingPIN').value = '';
  alert('Settings saved!');
}

init();
</script>
</body>
