<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Morning Chores</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --green: #34d399;
      --green-dark: #22c55e;
      --gold: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      -webkit-user-select: none;
      user-select: none;
      color: #1a1a2e;
      overflow: hidden;
    }

    /* ===== TOP BAR ===== */
    #topBar {
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 14px;
      padding-top: max(env(safe-area-inset-top), 10px);
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
    }
    .top-left { flex-shrink: 0; }
    .top-name { font-size: 17px; font-weight: 800; }
    .top-level { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .level-badge {
      background: rgba(255,255,255,0.25);
      padding: 1px 7px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .level-title { font-size: 12px; opacity: 0.9; }
    .top-xp { flex: 1; min-width: 0; }
    .xp-bar {
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    .xp-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 4px;
      transition: width 0.5s ease;
      width: 0%;
    }
    .xp-text { font-size: 10px; opacity: 0.8; display: block; margin-top: 2px; }
    .top-streak { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .streak-fire { font-size: 20px; }
    .streak-count { font-size: 16px; font-weight: 800; }
    .settings-link {
      color: white;
      text-decoration: none;
      font-size: 20px;
      opacity: 0.6;
      flex-shrink: 0;
      padding: 4px;
    }

    /* ===== TAB CONTENT ===== */
    #tabContent {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px 16px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    #activitiesTab, .activity-grid, .activity-card, .filter-bar, .filter-btn { touch-action: pan-y; }

    /* ===== TAB BAR ===== */
    #tabBar {
      flex-shrink: 0;
      display: flex;
      background: white;
      border-top: 2px solid #e5e7eb;
      padding: 4px 0;
      padding-bottom: max(env(safe-area-inset-bottom), 6px);
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      padding: 6px 2px 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: var(--primary); }
    .tab-icon { font-size: 22px; }

    /* ===== CHORES TAB ===== */
    .date-display {
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .chore-card {
      background: white;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      -webkit-tap-highlight-color: transparent;
      position: relative;
      border: 2px solid transparent;
    }
    .chore-card:active { transform: scale(0.97); }
    .chore-card.done { background: #e8f9ee; border-color: var(--green); }
    .chore-check {
      width: 34px; height: 34px;
      border-radius: 10px;
      border: 3px solid #d1d5db;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;
      background: white;
    }
    .chore-card.done .chore-check { background: var(--green); border-color: var(--green); }
    .chore-check svg {
      width: 18px; height: 18px;
      stroke: white; stroke-width: 3; fill: none;
      opacity: 0; transition: opacity 0.2s;
    }
    .chore-card.done .chore-check svg { opacity: 1; }
    .chore-info { flex: 1; }
    .chore-title-text { font-size: 17px; font-weight: 700; }
    .chore-card.done .chore-title-text { color: var(--green-dark); text-decoration: line-through; }
    .chore-subtitle-text { font-size: 13px; color: #999; margin-top: 1px; }
    .chore-icon-display { font-size: 30px; flex-shrink: 0; }
    .chore-xp { position: absolute; top: 5px; right: 10px; font-size: 10px; font-weight: 700; color: var(--gold); }

    /* Daily Progress */
    .daily-progress {
      margin-top: 14px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
    }
    .progress-bar-bg {
      width: 100%; height: 12px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--green-dark));
      border-radius: 6px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-text { margin-top: 6px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.9); }
    .all-done-banner {
      display: none; margin-top: 18px; text-align: center;
      background: white; border-radius: 16px; padding: 22px;
      animation: pop 0.5s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .all-done-banner.visible { display: block; }
    .all-done-trophy { font-size: 52px; }
    .all-done-msg { font-size: 20px; font-weight: 800; color: var(--green-dark); margin-top: 4px; }
    .all-done-sub { font-size: 13px; color: #888; margin-top: 4px; }

    /* ===== BADGES TAB ===== */
    .badges-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .badge-card {
      background: white; border-radius: 14px;
      padding: 14px 6px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: all 0.3s;
    }
    .badge-card.locked { opacity: 0.45; filter: grayscale(1); }
    .badge-emoji { font-size: 34px; }
    .badge-name { font-size: 11px; font-weight: 700; color: #333; margin-top: 4px; line-height: 1.2; }
    .badge-card.locked .badge-name { color: #999; }

    /* ===== CHAT TAB ===== */
    .chat-container {
      display: flex; flex-direction: column; align-items: center;
      height: calc(100vh - 160px); justify-content: space-between;
      touch-action: pan-y;
    }
    .chat-avatar {
      font-size: 64px; margin-top: 8px; animation: avatarBounce 2s ease infinite;
    }
    @keyframes avatarBounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .chat-avatar.talking { animation: avatarTalk 0.3s ease infinite; }
    @keyframes avatarTalk {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .chat-speech {
      background: white; color: #333; border-radius: 20px;
      padding: 16px 20px; margin: 12px 8px; font-size: 17px;
      font-weight: 600; line-height: 1.5; text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      max-width: 95%; position: relative;
      cursor: pointer; transition: transform 0.2s;
    }
    .chat-speech:active { transform: scale(0.97); }
    .chat-speech::after {
      content: ''; position: absolute; top: -10px; left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent; border-right: 10px solid transparent;
      border-bottom: 10px solid white;
    }
    .chat-thinking {
      display: none; color: rgba(255,255,255,0.8); font-size: 16px;
      font-weight: 600; padding: 14px; text-align: center;
    }
    .chat-thinking.visible { display: block; }
    .thinking-dots::after {
      content: ''; animation: dots 1.4s steps(4,end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
    .chat-you-said {
      color: rgba(255,255,255,0.6); font-size: 13px;
      font-style: italic; text-align: center; min-height: 18px;
    }
    .chat-prompts {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; padding: 4px 0;
    }
    .chat-prompt-btn {
      background: white; border: none; border-radius: 16px;
      padding: 10px 14px; font-size: 14px; font-weight: 600;
      color: #333; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s;
    }
    .chat-prompt-btn:active { transform: scale(0.95); }
    .mic-area { display: flex; flex-direction: column; align-items: center; padding: 6px 0; }
    .mic-btn {
      width: 72px; height: 72px; border-radius: 50%;
      background: white; border: 3px solid var(--primary);
      font-size: 32px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.listening {
      background: var(--primary); border-color: white;
      animation: micPulse 1s ease infinite;
    }
    @keyframes micPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(102,126,234,0.4); }
      50% { box-shadow: 0 0 0 14px rgba(102,126,234,0); }
    }
    .mic-label {
      font-size: 13px; color: rgba(255,255,255,0.7);
      margin-top: 6px; font-weight: 600;
    }
    .chat-disabled {
      text-align: center; color: rgba(255,255,255,0.7);
      padding: 40px 20px; font-size: 15px;
    }

    /* ===== ACTIVITIES TAB ===== */
    .filter-bar {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-btn {
      background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.3);
      border-radius: 20px; padding: 6px 12px;
      font-size: 12px; font-weight: 700; color: white;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: all 0.2s;
    }
    .filter-btn.active { background: white; color: var(--primary); border-color: white; }
    .filter-btn:active { transform: scale(0.95); }
    .activity-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .activity-card {
      background: white; border-radius: 14px;
      padding: 12px 8px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer; transition: all 0.2s;
    }
    .activity-card:active { transform: scale(0.95); }
    .activity-card.hidden { display: none; }
    .activity-emoji { font-size: 28px; }
    .activity-name { font-size: 11px; font-weight: 600; color: #333; margin-top: 3px; line-height: 1.2; }
    .activity-card.tappable { border: 2px solid var(--gold); }
    .tap-hint { font-size: 9px; color: var(--gold); font-weight: 700; margin-top: 2px; }
    .no-results { text-align: center; color: rgba(255,255,255,0.7); padding: 30px; font-size: 14px; }

    /* Speaker buttons */
    .speak-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(102,126,234,0.12); border: none;
      font-size: 15px; cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s;
    }
    .speak-btn:active { background: rgba(102,126,234,0.3); }
    .speak-btn.speaking { animation: pulse 0.8s ease infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    .pick-btn {
      display: block; margin: 0 auto 18px;
      background: white; border: none; border-radius: 20px;
      padding: 10px 24px; font-size: 15px; font-weight: 700;
      color: var(--primary); cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .pick-btn:active { transform: scale(0.95); }
    .pick-result {
      display: none; text-align: center; background: white;
      border-radius: 16px; padding: 20px; margin-bottom: 18px;
      animation: pop 0.4s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .pick-result.visible { display: block; }
    .pick-result-emoji { font-size: 48px; }
    .pick-result-text { font-size: 18px; font-weight: 700; margin-top: 6px; color: #333; }

    /* ===== MODALS ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal-content {
      background: white; border-radius: 24px;
      padding: 28px; text-align: center;
      max-width: 300px; width: 85%;
      animation: pop 0.4s ease;
    }
    .modal-emoji { font-size: 56px; }
    .modal-title { font-size: 22px; font-weight: 800; margin-top: 8px; }
    .modal-subtitle { font-size: 14px; color: #666; margin-top: 6px; }
    .modal-btn {
      margin-top: 16px; background: var(--primary); color: white;
      border: none; border-radius: 12px;
      padding: 10px 28px; font-size: 15px; font-weight: 700; cursor: pointer;
    }

    /* ===== CONFETTI ===== */
    #confettiCanvas {
      display: none; position: fixed; inset: 0;
      z-index: 999; pointer-events: none;
    }

    /* ===== STICKER POP ===== */
    .sticker-pop {
      position: fixed; font-size: 44px; z-index: 998;
      pointer-events: none; animation: stickerFloat 1s ease forwards;
    }
    @keyframes stickerFloat {
      0% { transform: scale(0); opacity: 1; }
      30% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1) translateY(-80px); opacity: 0; }
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ===== LOADING ===== */
    #loadingScreen {
      display: flex; align-items: center; justify-content: center;
      flex: 1; color: white; font-size: 18px; font-weight: 600;
    }
    .loading-spinner {
      display: inline-block; width: 22px; height: 22px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loadingScreen"><div class="loading-spinner"></div>Loading...</div>

  <!-- App -->
  <div id="app" style="display:none;flex-direction:column;height:100vh;height:-webkit-fill-available;">

    <!-- Top Bar -->
    <div id="topBar">
      <div class="top-left">
        <div class="top-name" id="childName">Buddy</div>
        <div class="top-level">
          <span class="level-badge" id="levelBadge">Lv.1</span>
          <span class="level-title" id="levelTitle">Little Helper</span>
        </div>
      </div>
      <div class="top-xp">
        <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
        <span class="xp-text" id="xpText">0 / 50 XP</span>
      </div>
      <div class="top-streak">
        <span class="streak-fire">🔥</span>
        <span class="streak-count" id="streakCount">0</span>
      </div>
      <a href="parent.html" class="settings-link">⚙️</a>
    </div>

    <!-- Tab Content -->
    <div id="tabContent">

      <!-- CHORES -->
      <div id="choresTab" class="tab-panel active">
        <div class="date-display" id="dateDisplay"></div>
        <div id="choreList"></div>
        <div class="daily-progress">
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText">0 of 0 done</div>
        </div>
        <div class="all-done-banner" id="allDoneBanner" onclick="speak('All chores done! Great job today! You are a champion!')">
          <div class="all-done-trophy">🏆</div>
          <div class="all-done-msg">All Chores Done!</div>
          <div class="all-done-sub">Great job today! You're a champion!</div>
        </div>
      </div>

      <!-- BADGES -->
      <div id="badgesTab" class="tab-panel">
        <div id="badgesContainer"></div>
      </div>

      <!-- CHAT -->
      <div id="chatTab" class="tab-panel">
        <div id="chatContent"></div>
      </div>

      <!-- ACTIVITIES -->
      <div id="activitiesTab" class="tab-panel">
        <div id="activitiesContainer"></div>
      </div>

    </div>

    <!-- Tab Bar -->
    <nav id="tabBar">
      <button class="tab-btn active" data-tab="chores" onclick="switchTab('chores')">
        <span class="tab-icon">⭐</span>Chores
      </button>
      <button class="tab-btn" data-tab="badges" onclick="switchTab('badges')">
        <span class="tab-icon">🏆</span>Badges
      </button>
      <button class="tab-btn" data-tab="chat" onclick="switchTab('chat')">
        <span class="tab-icon">💬</span>Chat
      </button>
      <button class="tab-btn" data-tab="activities" onclick="switchTab('activities')">
        <span class="tab-icon">💡</span>Ideas
      </button>
    </nav>
  </div>

  <!-- Level Up Modal -->
  <div class="modal-overlay" id="levelUpModal">
    <div class="modal-content">
      <div class="modal-emoji">🎉</div>
      <div class="modal-title">Level Up!</div>
      <div class="modal-subtitle" id="levelUpSub"></div>
      <button class="modal-btn" onclick="closeModal('levelUpModal')">Awesome!</button>
    </div>
  </div>

  <!-- Badge Modal -->
  <div class="modal-overlay" id="badgeModal">
    <div class="modal-content">
      <div class="modal-emoji" id="badgeModalEmoji">⭐</div>
      <div class="modal-title">Badge Unlocked!</div>
      <div class="modal-subtitle" id="badgeModalName"></div>
      <button class="modal-btn" onclick="closeModal('badgeModal')">Cool!</button>
    </div>
  </div>

  <!-- Activity Detail Modal -->
  <div class="modal-overlay" id="activityDetailModal">
    <div class="modal-content" style="max-width:340px;">
      <div class="modal-emoji" id="actDetailEmoji">📖</div>
      <div class="modal-title" id="actDetailTitle" style="font-size:18px;"></div>
      <div class="modal-subtitle" id="actDetailText" style="text-align:left;line-height:1.5;margin-top:10px;"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;">
        <button class="modal-btn" onclick="closeModal('activityDetailModal')">Got it!</button>
        <button class="modal-btn" id="actDetailBtn2" style="background:#22c55e;" onclick="showActivityDetail(document.getElementById('actDetailEmoji').textContent==='📖'?'bible':document.getElementById('actDetailEmoji').textContent==='❤️'?'jesus':'draw')">Another!</button>
      </div>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

<script>

// ===== UTILITIES =====
function getToday() { return new Date().toISOString().split('T')[0]; }
function getYesterday() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}
function getLevelInfo(xp) {
  let cur = LEVELS[0], nxt = LEVELS[1];
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (xp >= LEVELS[i].xp) {
      cur = LEVELS[i]; nxt = LEVELS[i + 1] || null; break;
    }
  }
  const inLvl = xp - cur.xp;
  const need = nxt ? nxt.xp - cur.xp : 0;
  return { level: cur.level, title: cur.title, xp, inLvl, need, progress: nxt ? inLvl / need : 1, isMax: !nxt };
}

// ===== TEXT TO SPEECH =====
let bestVoice = null;
function loadVoices() {
  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) return;
  // Prefer premium/enhanced natural voices on iOS/macOS
  bestVoice =
    voices.find(v => v.name.includes('Samantha') && v.name.includes('Enhanced')) ||
    voices.find(v => v.name.includes('Samantha') && v.name.includes('Premium')) ||
    voices.find(v => v.name === 'Samantha') ||
    voices.find(v => v.lang.startsWith('en') && (v.name.includes('Enhanced') || v.name.includes('Premium'))) ||
    voices.find(v => v.lang.startsWith('en') && v.localService) ||
    voices.find(v => v.lang.startsWith('en'));
}
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, btn) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.9;
  utter.pitch = 1.05;
  if (bestVoice) utter.voice = bestVoice;
  if (btn) { btn.classList.add('speaking'); utter.onend = () => btn.classList.remove('speaking'); }
  window.speechSynthesis.speak(utter);
}

// ===== FIREBASE =====
async function initFirebase() {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  try { await db.enablePersistence(); } catch (e) { /* ok */ }
}

async function loadConfig() {
  const doc = await db.collection('config').doc('settings').get();
  if (doc.exists) config = { ...config, ...doc.data() };
  else await db.collection('config').doc('settings').set(config);
}

async function loadProfile() {
  const doc = await db.collection('profile').doc('main').get();
  if (doc.exists) profile = { ...profile, ...doc.data() };
  else await db.collection('profile').doc('main').set(profile);
}

async function loadChores() {
  let snap = await db.collection('chores').orderBy('order').get();
  if (snap.empty) {
    const batch = db.batch();
    DEFAULT_CHORES.forEach(c => batch.set(db.collection('chores').doc(), c));
    await batch.commit();
    snap = await db.collection('chores').orderBy('order').get();
  }
  chores = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.active !== false);
}

async function loadToday() {
  const doc = await db.collection('completions').doc(getToday()).get();
  if (doc.exists) todayDoc = { done: [], xpAwarded: [], allDoneBonus: false, ...doc.data() };
}

async function saveProfile() { await db.collection('profile').doc('main').set(profile); }
async function saveToday() { await db.collection('completions').doc(getToday()).set(todayDoc); }

// ===== STREAK =====
function checkStreakOnLoad() {
  if (!profile.lastAllDoneDate) return;
  const today = getToday(), yesterday = getYesterday();
  if (profile.lastAllDoneDate === today || profile.lastAllDoneDate === yesterday) return;
  profile.streak = 0; // broken
}

// ===== CHORE TOGGLE =====
async function toggleChore(choreId) {
  const idx = todayDoc.done.indexOf(choreId);
  const chore = chores.find(c => c.id === choreId);
  if (!chore) return;

  if (idx === -1) {
    // Complete
    todayDoc.done.push(choreId);
    if (!todayDoc.xpAwarded.includes(choreId)) {
      todayDoc.xpAwarded.push(choreId);
      const oldLvl = getLevelInfo(profile.xp).level;
      profile.xp += (chore.xp || 10);
      profile.totalChoresCompleted += 1;
      if (chore.specialTrack === 'bible') profile.bibleReadCount = (profile.bibleReadCount || 0) + 1;
      const newLvl = getLevelInfo(profile.xp).level;
      if (newLvl > oldLvl) setTimeout(() => showLevelUp(newLvl), 300);
      showStickerPop(choreId);
    }
    // All done?
    if (todayDoc.done.length >= chores.length && !todayDoc.allDoneBonus) {
      todayDoc.allDoneBonus = true;
      profile.xp += 25;
      const today = getToday(), yesterday = getYesterday();
      if (profile.lastAllDoneDate === yesterday) profile.streak += 1;
      else if (profile.lastAllDoneDate !== today) profile.streak = 1;
      profile.lastAllDoneDate = today;
      if ([3,7,14,30].includes(profile.streak)) profile.xp += profile.streak * 5;
      setTimeout(() => { showConfetti(); speak('All chores done! Great job today! You are a champion!'); }, 200);
    }
    checkBadges();
  } else {
    todayDoc.done.splice(idx, 1);
  }

  await Promise.all([saveProfile(), saveToday()]);
  renderChores(); updateTopBar(); updateProgress();
}

// ===== BADGES =====
function checkBadges() {
  const info = getLevelInfo(profile.xp);
  const checks = {
    'first-chore': profile.totalChoresCompleted >= 1,
    'clean-sweep': profile.lastAllDoneDate !== null,
    'streak-3': profile.streak >= 3,
    'streak-7': profile.streak >= 7,
    'streak-14': profile.streak >= 14,
    'streak-30': profile.streak >= 30,
    'level-3': info.level >= 3,
    'level-5': info.level >= 5,
    'level-8': info.level >= 8,
    'xp-100': profile.xp >= 100,
    'xp-500': profile.xp >= 500,
    'goal-setter': (profile.goalsSet || 0) >= 1,
    'goal-getter': (profile.goalsCompleted || 0) >= 1,
    'bible-10': (profile.bibleReadCount || 0) >= 10,
  };
  let newBadge = null;
  for (const [id, earned] of Object.entries(checks)) {
    if (earned && !profile.badges.includes(id)) {
      profile.badges.push(id);
      if (!newBadge) newBadge = BADGES.find(b => b.id === id);
    }
  }
  if (newBadge) setTimeout(() => showBadgeUnlock(newBadge), 600);
  renderBadges();
}

  const done = todayDoc.done.length, total = chores.length;

  document.getElementById('progressText').textContent = done + ' of ' + total + ' done';

function setFilter(id) {
  activeFilter = id;
  renderActivities();
}

function showActivityDetail(type) {
  let item;
  if (type === 'bible') item = BIBLE_STORIES[Math.floor(Math.random() * BIBLE_STORIES.length)];
  else if (type === 'jesus') item = JESUS_FACTS[Math.floor(Math.random() * JESUS_FACTS.length)];
  else if (type === 'draw') item = DRAW_PROMPTS[Math.floor(Math.random() * DRAW_PROMPTS.length)];
  if (!item) return;
  document.getElementById('actDetailEmoji').textContent = type === 'bible' ? '📖' : type === 'jesus' ? '❤️' : '🎨';
  document.getElementById('actDetailTitle').textContent = item.title;
  document.getElementById('actDetailText').textContent = item.text;
  document.getElementById('actDetailBtn2').style.display = 'inline-block';
  document.getElementById('activityDetailModal').classList.add('visible');
  speak(item.title + '. ' + item.text);
}

function pickRandom() {
  const filtered = activeFilter === 'all' ? ACTIVITIES : ACTIVITIES.filter(a => a.tags.includes(activeFilter));
  if (filtered.length === 0) return;
  const pick = filtered[Math.floor(Math.random() * filtered.length)];
  document.getElementById('pickEmoji').textContent = pick.emoji;
  document.getElementById('pickText').textContent = pick.name;
  speak(pick.name);
  const el = document.getElementById('pickResult');
  el.classList.remove('visible');
  void el.offsetWidth;
  el.classList.add('visible');
}

// ===== TAB SWITCHING =====
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab + 'Tab').classList.add('active');
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
}

// ===== ANIMATIONS =====
function showConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#ff0000','#00cc44','#0066ff','#ffdd00','#ff00ff','#00cccc','#ff6600','#ff69b4'];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -10 - Math.random() * 300,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 4,
      rot: Math.random() * 360, rs: (Math.random() - 0.5) * 10,
    });
  }
  let frame = 0;
  (function go() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.rs;
      if (p.y < canvas.height + 20) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (alive && ++frame < 250) requestAnimationFrame(go);
    else canvas.style.display = 'none';
  })();
}

function showStickerPop(choreId) {
  const el = document.getElementById('chore-' + choreId);
  if (!el) return;
  const r = el.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'sticker-pop';
  s.textContent = STICKER_EMOJIS[Math.floor(Math.random() * STICKER_EMOJIS.length)];
  s.style.left = (r.left + r.width / 2 - 22) + 'px';
  s.style.top = r.top + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

function showLevelUp(level) {
  const info = LEVELS.find(l => l.level === level);
  document.getElementById('levelUpSub').textContent =
    'Level ' + level + ' — ' + (info ? info.title : '') + '!';
  document.getElementById('levelUpModal').classList.add('visible');
  showConfetti();
  speak('Level Up! You reached Level ' + level + ', ' + (info ? info.title : '') + '!');
}

function showBadgeUnlock(badge) {
  document.getElementById('badgeModalEmoji').textContent = badge.emoji;
  document.getElementById('badgeModalName').textContent = badge.name + ' — ' + badge.desc;
  document.getElementById('badgeModal').classList.add('visible');
  speak('Badge unlocked! ' + badge.name + '. ' + badge.desc);
}

function closeModal(id) { document.getElementById(id).classList.remove('visible'); }

// ===== CHAT =====
let micRecognition = null;
let micListening = false;

async function sendChatText(text) {
  if (!text || !text.trim()) return;
  text = text.trim();

  const speech = document.getElementById('chatSpeech');
  const prompts = document.getElementById('chatPrompts');
  const thinking = document.getElementById('chatThinking');
  const youSaid = document.getElementById('chatYouSaid');
  const avatar = document.getElementById('chatAvatar');

  // Show what the kid said
  if (youSaid) youSaid.textContent = 'You said: "' + text + '"';
  if (prompts) prompts.style.display = 'none';
  if (speech) speech.style.display = 'none';
  if (thinking) thinking.classList.add('visible');
  chatHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch(config.workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: chatHistory.slice(-10),
        context: { name: config.childName, level: getLevelInfo(profile.xp).title, streak: profile.streak }
      })
    });
    const rawText = await res.text();
    let data;
    try { data = JSON.parse(rawText); } catch (pe) {
      showHelperReply("Oops! I can't talk right now. Try again!", speech, thinking, prompts, avatar);
      return;
    }
    if (data.error) {
      showHelperReply("Hmm, something went wrong. Try again!", speech, thinking, prompts, avatar);
    } else {
      const reply = data.reply || data.content?.[0]?.text || "Hmm, I'm not sure what to say!";
      chatHistory.push({ role: 'assistant', content: reply });
      showHelperReply(reply, speech, thinking, prompts, avatar);
    }
  } catch (e) {
    showHelperReply("Oops! I can't reach my brain right now. Try again!", speech, thinking, prompts, avatar);
  }
}

function showHelperReply(text, speech, thinking, prompts, avatar) {
  if (thinking) thinking.classList.remove('visible');
  if (speech) {
    speech.textContent = text;
    speech.style.display = '';
    speech.style.animation = 'none';
    void speech.offsetWidth;
    speech.style.animation = 'pop 0.4s ease';
  }
  if (prompts) prompts.style.display = '';
  // Animate avatar while speaking
  if (avatar) avatar.classList.add('talking');
  speak(text);
  // Stop avatar animation when speech ends (estimate ~80ms per char)
  setTimeout(function() {
    if (avatar) avatar.classList.remove('talking');
  }, Math.max(2000, text.length * 80));
}

function toggleMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    const label = document.getElementById('micLabel');
    if (label) label.textContent = 'Voice not supported on this device';
    return;
  }

  if (micListening && micRecognition) {
    micRecognition.stop();
    return;
  }

  micRecognition = new SpeechRecognition();
  micRecognition.lang = 'en-US';
  micRecognition.interimResults = false;
  micRecognition.maxAlternatives = 1;

  const btn = document.getElementById('micBtn');
  const label = document.getElementById('micLabel');

  micRecognition.onstart = function() {
    micListening = true;
    if (btn) btn.classList.add('listening');
    if (label) label.textContent = 'Listening...';
  };

  micRecognition.onresult = function(e) {
    const transcript = e.results[0][0].transcript;
    sendChatText(transcript);
  };

  micRecognition.onerror = function(e) {
    micListening = false;
    if (btn) btn.classList.remove('listening');
    if (e.error === 'no-speech') {
      if (label) label.textContent = "I didn't hear anything. Try again!";
    } else {
      if (label) label.textContent = 'Tap to talk';
    }
  };

  micRecognition.onend = function() {
    micListening = false;
    if (btn) btn.classList.remove('listening');
    if (label) label.textContent = 'Tap to talk';
  };

  micRecognition.start();
}

// ===== INIT =====
async function init() {
  try {
    await initFirebase();
    await Promise.all([loadConfig(), loadProfile(), loadChores()]);
    await loadToday();
    checkStreakOnLoad();

    const opts = { weekday: 'long', month: 'long', day: 'numeric' };
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', opts);

    updateTopBar();
    renderChores();
    updateProgress();
    renderBadges();
    renderChat();
    renderActivities();

    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  } catch (e) {
    console.error('Init failed:', e);
    document.getElementById('loadingScreen').innerHTML =
      '<div style="text-align:center;color:white;padding:20px;max-width:400px;">' +
      '<div style="font-size:48px;margin-bottom:12px;">🔧</div>' +
      '<h2>Setup Needed</h2>' +
      '<p style="margin-top:10px;opacity:0.85;font-size:14px;line-height:1.5;">' +
      'Open <b>index.html</b> and replace the <code style="background:rgba(255,255,255,0.2);padding:2px 6px;border-radius:4px;">firebaseConfig</code> values with your Firebase project settings.</p>' +
      '</div>';
  }
}

init();
