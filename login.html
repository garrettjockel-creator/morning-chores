<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kid Login — Morning Chores</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --green: #34d399;
      --gold: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
      -webkit-user-select: none;
      user-select: none;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-emoji { font-size: 72px; margin-bottom: 16px; }
    .hero-title {
      font-size: 36px; font-weight: 900;
      text-align: center; line-height: 1.2;
      margin-bottom: 8px;
    }
    .hero-subtitle {
      font-size: 18px; opacity: 0.9;
      text-align: center; font-weight: 600;
      margin-bottom: 32px;
    }

    /* Code entry card */
    .login-card {
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      color: #1a1a2e;
      text-align: center;
    }
    .login-card-title {
      font-size: 20px; font-weight: 800;
      margin-bottom: 6px;
    }
    .login-card-sub {
      font-size: 14px; color: #888;
      margin-bottom: 20px;
    }

    .code-input {
      width: 100%;
      padding: 16px;
      border: 3px solid #e5e7eb;
      border-radius: 16px;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 8px;
      text-transform: uppercase;
      outline: none;
      -webkit-appearance: none;
    }
    .code-input::placeholder {
      letter-spacing: 2px;
      font-size: 16px;
      font-weight: 600;
      color: #ccc;
    }
    .code-input:focus { border-color: var(--primary); }

    .go-btn {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .go-btn:active { transform: scale(0.97); }
    .go-btn:disabled { background: #ccc; cursor: not-allowed; }

    .error-msg {
      color: #ef4444;
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    /* Screen 2 — Confirm kid */
    .confirm-screen { display: none; }
    .confirm-screen.visible { display: block; }
    .code-screen.hidden { display: none; }

    .kid-card {
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      color: #1a1a2e;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
      border: 3px solid transparent;
    }
    .kid-card:active { transform: scale(0.97); }
    .kid-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 40px;
      color: white;
    }
    .kid-name {
      font-size: 28px;
      font-weight: 900;
    }

    .confirm-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .confirm-btn:active { transform: scale(0.97); }

    .not-me-link {
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.7;
    }
    .not-me-link a {
      color: white;
      text-decoration: underline;
      font-weight: 600;
      cursor: pointer;
    }

    .back-link {
      margin-top: 24px;
      font-size: 14px;
      opacity: 0.7;
    }
    .back-link a { color: white; text-decoration: underline; font-weight: 600; }

    .footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 12px;
      opacity: 0.5;
      text-align: center;
    }

    /* Loading spinner */
    .loading-spinner {
      display: none;
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 12px auto 0;
    }
    .loading-spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">

    <!-- Screen 1: Enter Family Code -->
    <div class="code-screen" id="codeScreen">
      <div class="hero-emoji">👋</div>
      <h1 class="hero-title">Hi there!</h1>
      <p class="hero-subtitle">Enter your family code to get started</p>

      <div class="login-card">
        <div class="login-card-title">Family Code</div>
        <div class="login-card-sub">Ask your parent for this code</div>
        <input type="text" class="code-input" id="codeInput" placeholder="ABC123" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <button class="go-btn" id="goBtn" onclick="lookupCode()">Let's Go!</button>
        <div class="loading-spinner" id="codeSpinner"></div>
        <div class="error-msg" id="codeError">Hmm, that code didn't work. Try again!</div>
      </div>

      <div class="back-link">
        <a href="index.html">&larr; Back to home</a>
      </div>
    </div>

    <!-- Screen 2: Confirm Kid -->
    <div class="confirm-screen" id="confirmScreen">
      <div class="hero-emoji">🎉</div>
      <h1 class="hero-title">Is this you?</h1>
      <p class="hero-subtitle">Tap your name to jump in!</p>

      <div class="kid-card" id="kidCard" onclick="confirmKid()">
        <div class="kid-avatar" id="kidAvatar">⭐</div>
        <div class="kid-name" id="kidName"></div>
      </div>

      <button class="confirm-btn" onclick="confirmKid()">That's me!</button>

      <div class="not-me-link">
        <a onclick="goBack()">Not me — go back</a>
      </div>
    </div>

    <div class="footer">Morning Chores App</div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC08HJ3Q8yitpJyTG28nhrWhZBv2s3YDwE",
  authDomain: "morning-chores-ee2f3.firebaseapp.com",
  projectId: "morning-chores-ee2f3",
  storageBucket: "morning-chores-ee2f3.firebasestorage.app",
  messagingSenderId: "374643848407",
  appId: "1:374643848407:web:642a57af25f97f037cec92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let foundFamilyId = null;
let foundChildName = null;

// Auto-uppercase as user types
document.getElementById('codeInput').addEventListener('input', function() {
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});

// Enter key
document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') lookupCode();
});

async function lookupCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const errorEl = document.getElementById('codeError');
  const spinner = document.getElementById('codeSpinner');
  const btn = document.getElementById('goBtn');

  errorEl.classList.remove('visible');

  if (!code || code.length < 6) {
    errorEl.textContent = 'Please enter a 6-character code.';
    errorEl.classList.add('visible');
    return;
  }

  btn.disabled = true;
  spinner.classList.add('visible');

  try {
    const snap = await db.collection('families').where('familyCode', '==', code).get();

    if (snap.empty) {
      errorEl.textContent = "Hmm, that code didn't work. Try again!";
      errorEl.classList.add('visible');
      document.getElementById('codeInput').classList.add('shake');
      setTimeout(() => document.getElementById('codeInput').classList.remove('shake'), 400);
      btn.disabled = false;
      spinner.classList.remove('visible');
      return;
    }

    const doc = snap.docs[0];
    foundFamilyId = doc.id;
    foundChildName = doc.data().childName || 'Kid';

    // Show Screen 2
    document.getElementById('kidName').textContent = foundChildName;
    document.getElementById('kidAvatar').textContent = foundChildName.charAt(0).toUpperCase();
    document.getElementById('codeScreen').classList.add('hidden');
    document.getElementById('confirmScreen').classList.add('visible');

  } catch (e) {
    console.error('Lookup failed:', e);
    errorEl.textContent = 'Something went wrong. Please try again.';
    errorEl.classList.add('visible');
  }

  btn.disabled = false;
  spinner.classList.remove('visible');
}

function confirmKid() {
  localStorage.setItem('familyId', foundFamilyId);
  window.location.href = 'app.html?f=' + foundFamilyId;
}

function goBack() {
  foundFamilyId = null;
  foundChildName = null;
  document.getElementById('confirmScreen').classList.remove('visible');
  document.getElementById('codeScreen').classList.remove('hidden');
  document.getElementById('codeInput').value = '';
  document.getElementById('codeError').classList.remove('visible');
}
</script>
</body>
</html>
