<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kid Login — Morning Chores</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --green: #34d399;
      --gold: #fbbf24;
      --red: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
      -webkit-user-select: none;
      user-select: none;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-emoji { font-size: 72px; margin-bottom: 16px; }
    .hero-title {
      font-size: 36px; font-weight: 900;
      text-align: center; line-height: 1.2;
      margin-bottom: 8px;
    }
    .hero-subtitle {
      font-size: 18px; opacity: 0.9;
      text-align: center; font-weight: 600;
      margin-bottom: 32px;
    }

    /* Card */
    .login-card {
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      color: #1a1a2e;
      text-align: center;
    }
    .login-card-title {
      font-size: 20px; font-weight: 800;
      margin-bottom: 6px;
    }
    .login-card-sub {
      font-size: 14px; color: #888;
      margin-bottom: 20px;
    }

    .name-input {
      width: 100%;
      padding: 16px;
      border: 3px solid #e5e7eb;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
    }
    .name-input::placeholder {
      font-size: 16px;
      font-weight: 600;
      color: #ccc;
    }
    .name-input:focus { border-color: var(--primary); }

    .go-btn {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .go-btn:active { transform: scale(0.97); }
    .go-btn:disabled { background: #ccc; cursor: not-allowed; }

    .error-msg {
      color: var(--red);
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    /* Screen visibility */
    .screen { display: none; width: 100%; }
    .screen.visible { display: block; }

    /* PIN Pad */
    .pin-dots {
      display: flex; gap: 12px; justify-content: center; margin-bottom: 16px;
    }
    .pin-dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 3px solid #ccc; transition: all 0.2s;
    }
    .pin-dot.filled { background: var(--primary); border-color: var(--primary); }
    .pin-dot.error { background: var(--red); border-color: var(--red); }
    .pin-pad {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
      max-width: 220px; margin: 0 auto;
    }
    .pin-key {
      background: #f3f4f6; border: none; border-radius: 12px;
      padding: 14px; font-size: 22px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-key:active { background: #e5e7eb; }
    .pin-key.back { font-size: 16px; color: #888; }

    /* Kid picker */
    .kid-grid {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%;
    }
    .kid-card {
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 24px 20px;
      color: #1a1a2e;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
      border: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .kid-card:active { transform: scale(0.97); }
    .kid-card:hover { border-color: var(--green); }
    .kid-avatar {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 900;
      color: white;
      flex-shrink: 0;
    }
    .kid-name {
      font-size: 24px;
      font-weight: 900;
      text-align: left;
    }

    .back-link {
      margin-top: 24px;
      font-size: 14px;
      opacity: 0.7;
    }
    .back-link a { color: white; text-decoration: underline; font-weight: 600; cursor: pointer; }

    .footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 12px;
      opacity: 0.5;
      text-align: center;
    }

    /* Loading spinner */
    .loading-spinner {
      display: none;
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 12px auto 0;
    }
    .loading-spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">

    <!-- Screen 1: Enter Last Name -->
    <div class="screen visible" id="nameScreen">
      <div style="text-align:center;">
        <div class="hero-emoji">👋</div>
        <h1 class="hero-title">Hi there!</h1>
        <p class="hero-subtitle">What's your family last name?</p>
      </div>

      <div class="login-card">
        <div class="login-card-title">Last Name</div>
        <div class="login-card-sub">Ask your parent if you're not sure</div>
        <input type="text" class="name-input" id="lastNameInput" placeholder="e.g. Smith" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
        <button class="go-btn" id="nameBtn" onclick="submitLastName()">Next</button>
        <div class="loading-spinner" id="nameSpinner"></div>
        <div class="error-msg" id="nameError"></div>
      </div>

      <div class="back-link">
        <a href="index.html">&larr; Back to home</a>
      </div>
    </div>

    <!-- Screen 2: Enter PIN -->
    <div class="screen" id="pinScreen">
      <div style="text-align:center;">
        <div class="hero-emoji">🔒</div>
        <h1 class="hero-title">Enter PIN</h1>
        <p class="hero-subtitle">Type your 4-digit parent PIN</p>
      </div>

      <div class="login-card">
        <div class="pin-dots">
          <div class="pin-dot" id="d0"></div>
          <div class="pin-dot" id="d1"></div>
          <div class="pin-dot" id="d2"></div>
          <div class="pin-dot" id="d3"></div>
        </div>
        <div class="pin-pad">
          <button class="pin-key" onclick="pinPress('1')">1</button>
          <button class="pin-key" onclick="pinPress('2')">2</button>
          <button class="pin-key" onclick="pinPress('3')">3</button>
          <button class="pin-key" onclick="pinPress('4')">4</button>
          <button class="pin-key" onclick="pinPress('5')">5</button>
          <button class="pin-key" onclick="pinPress('6')">6</button>
          <button class="pin-key" onclick="pinPress('7')">7</button>
          <button class="pin-key" onclick="pinPress('8')">8</button>
          <button class="pin-key" onclick="pinPress('9')">9</button>
          <button class="pin-key" disabled></button>
          <button class="pin-key" onclick="pinPress('0')">0</button>
          <button class="pin-key back" onclick="pinBack()">&#9003;</button>
        </div>
        <div class="loading-spinner" id="pinSpinner"></div>
        <div class="error-msg" id="pinError"></div>
      </div>

      <div class="back-link">
        <a onclick="goBackToName()">&#8592; Try a different name</a>
      </div>
    </div>

    <!-- Screen 3: Pick Your Kid -->
    <div class="screen" id="kidScreen">
      <div style="text-align:center;">
        <div class="hero-emoji">🎉</div>
        <h1 class="hero-title">Who's here?</h1>
        <p class="hero-subtitle">Tap your name to jump in!</p>
      </div>

      <div class="kid-grid" id="kidGrid"></div>

      <div class="back-link">
        <a onclick="goBackToName()">&#8592; Go back</a>
      </div>
    </div>

    <div class="footer">Morning Chores App</div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC08HJ3Q8yitpJyTG28nhrWhZBv2s3YDwE",
  authDomain: "morning-chores-ee2f3.firebaseapp.com",
  projectId: "morning-chores-ee2f3",
  storageBucket: "morning-chores-ee2f3.firebasestorage.app",
  messagingSenderId: "374643848407",
  appId: "1:374643848407:web:642a57af25f97f037cec92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let familyDocs = []; // all docs matching lastNameLower
let matchedKids = []; // docs matching lastNameLower + pinHash
let pinBuffer = '';

// Enter key on last name input
document.getElementById('lastNameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitLastName();
});

// --- Screen navigation ---
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('visible'));
  document.getElementById(id).classList.add('visible');
}

// --- Screen 1: Last Name ---
async function submitLastName() {
  const input = document.getElementById('lastNameInput').value.trim();
  const errorEl = document.getElementById('nameError');
  const spinner = document.getElementById('nameSpinner');
  const btn = document.getElementById('nameBtn');

  errorEl.classList.remove('visible');

  if (!input) {
    errorEl.textContent = 'Please enter your last name.';
    errorEl.classList.add('visible');
    return;
  }

  btn.disabled = true;
  spinner.classList.add('visible');

  try {
    const snap = await db.collection('families')
      .where('lastNameLower', '==', input.toLowerCase())
      .get();

    if (snap.empty) {
      errorEl.textContent = "We couldn't find that family name. Try again!";
      errorEl.classList.add('visible');
      document.getElementById('lastNameInput').classList.add('shake');
      setTimeout(() => document.getElementById('lastNameInput').classList.remove('shake'), 400);
      btn.disabled = false;
      spinner.classList.remove('visible');
      return;
    }

    familyDocs = snap.docs;
    pinBuffer = '';
    updateDots();
    showScreen('pinScreen');

  } catch (e) {
    console.error('Lookup failed:', e);
    errorEl.textContent = 'Something went wrong. Please try again.';
    errorEl.classList.add('visible');
  }

  btn.disabled = false;
  spinner.classList.remove('visible');
}

// --- Screen 2: PIN ---
async function hashPin(pin) {
  const data = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('d' + i);
    dot.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
  }
}

function pinPress(digit) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updateDots();
  if (pinBuffer.length === 4) setTimeout(submitPin, 200);
}

function pinBack() {
  pinBuffer = pinBuffer.slice(0, -1);
  updateDots();
  document.getElementById('pinError').classList.remove('visible');
}

async function submitPin() {
  const spinner = document.getElementById('pinSpinner');
  const errorEl = document.getElementById('pinError');
  errorEl.classList.remove('visible');
  spinner.classList.add('visible');

  const hashed = await hashPin(pinBuffer);

  matchedKids = familyDocs.filter(d => d.data().pinHash === hashed);

  spinner.classList.remove('visible');

  if (matchedKids.length === 0) {
    errorEl.textContent = 'Wrong PIN. Try again!';
    errorEl.classList.add('visible');
    for (let i = 0; i < 4; i++) document.getElementById('d' + i).classList.add('error');
    setTimeout(() => {
      for (let i = 0; i < 4; i++) document.getElementById('d' + i).classList.remove('error');
    }, 600);
    pinBuffer = '';
    updateDots();
    return;
  }

  // Single kid → auto-load
  if (matchedKids.length === 1) {
    selectKid(matchedKids[0].id);
    return;
  }

  // Multiple kids → show picker
  renderKidPicker();
  showScreen('kidScreen');
}

// --- Screen 3: Kid Picker ---
function renderKidPicker() {
  const grid = document.getElementById('kidGrid');
  grid.innerHTML = matchedKids.map(doc => {
    const data = doc.data();
    const name = data.childName || 'Kid';
    const initial = name.charAt(0).toUpperCase();
    return '<div class="kid-card" onclick="selectKid(\'' + doc.id + '\')">' +
      '<div class="kid-avatar">' + initial + '</div>' +
      '<div class="kid-name">' + name + '</div>' +
      '</div>';
  }).join('');
}

function selectKid(familyId) {
  localStorage.setItem('familyId', familyId);
  window.location.href = 'app.html?f=' + familyId;
}

// --- Navigation ---
function goBackToName() {
  familyDocs = [];
  matchedKids = [];
  pinBuffer = '';
  document.getElementById('lastNameInput').value = '';
  document.getElementById('nameError').classList.remove('visible');
  document.getElementById('pinError').classList.remove('visible');
  showScreen('nameScreen');
}
</script>
</body>
</html>
