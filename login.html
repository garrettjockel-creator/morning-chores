<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kid Login — Morning Chores</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --green: #34d399;
      --gold: #fbbf24;
      --red: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
      -webkit-user-select: none;
      user-select: none;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-emoji { font-size: 72px; margin-bottom: 16px; }
    .hero-title {
      font-size: 36px; font-weight: 900;
      text-align: center; line-height: 1.2;
      margin-bottom: 8px;
    }
    .hero-subtitle {
      font-size: 18px; opacity: 0.9;
      text-align: center; font-weight: 600;
      margin-bottom: 32px;
    }

    /* Card */
    .login-card {
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      color: #1a1a2e;
      text-align: center;
    }
    .login-card-title {
      font-size: 20px; font-weight: 800;
      margin-bottom: 6px;
    }
    .login-card-sub {
      font-size: 14px; color: #888;
      margin-bottom: 20px;
    }

    .name-input {
      width: 100%;
      padding: 16px;
      border: 3px solid #e5e7eb;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
    }
    .name-input::placeholder {
      font-size: 16px;
      font-weight: 600;
      color: #ccc;
    }
    .name-input:focus { border-color: var(--primary); }

    .go-btn {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .go-btn:active { transform: scale(0.97); }
    .go-btn:disabled { background: #ccc; cursor: not-allowed; }

    .error-msg {
      color: var(--red);
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    /* Screen visibility */
    .screen { display: none; width: 100%; }
    .screen.visible { display: block; }

    /* PIN Pad */
    .pin-dots {
      display: flex; gap: 12px; justify-content: center; margin-bottom: 16px;
    }
    .pin-dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 3px solid #ccc; transition: all 0.2s;
    }
    .pin-dot.filled { background: var(--primary); border-color: var(--primary); }
    .pin-dot.error { background: var(--red); border-color: var(--red); }
    .pin-pad {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
      max-width: 220px; margin: 0 auto;
    }
    .pin-key {
      background: #f3f4f6; border: none; border-radius: 12px;
      padding: 14px; font-size: 22px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-key:active { background: #e5e7eb; }
    .pin-key.back { font-size: 16px; color: #888; }

    /* Kid picker */
    .kid-grid {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%;
    }
    .kid-card {
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 24px 20px;
      color: #1a1a2e;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
      border: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .kid-card:active { transform: scale(0.97); }
    .kid-card:hover { border-color: var(--green); }
    .kid-avatar {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 900;
      color: white;
      flex-shrink: 0;
    }
    .kid-name {
      font-size: 24px;
      font-weight: 900;
      text-align: left;
    }

    .back-link {
      margin-top: 24px;
      font-size: 14px;
      opacity: 0.7;
    }
    .back-link a { color: white; text-decoration: underline; font-weight: 600; cursor: pointer; }

    .footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 12px;
      opacity: 0.5;
      text-align: center;
    }

    /* Loading spinner */
    .loading-spinner {
      display: none;
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 12px auto 0;
    }
    .loading-spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">

    <!-- Sign in -->
    <div class="screen visible" id="signInScreen">
      <div style="text-align:center;">
        <div class="hero-emoji">⭐</div>
        <h1 class="hero-title">Morning Chores</h1>
        <p class="hero-subtitle">Have a grown-up sign in to start</p>
      </div>

      <div class="login-card">
        <div class="login-card-title">Parent Sign-In</div>
        <div class="login-card-sub">Sign in with the Google account you used at signup</div>
        <button class="go-btn" id="signInBtn" onclick="signInGoogle()">Sign in with Google</button>
        <div class="loading-spinner" id="signInSpinner"></div>
        <div class="error-msg" id="signInError"></div>
        <a id="switchAccount" style="display:none;cursor:pointer;font-size:13px;color:#888;text-decoration:underline;" onclick="signOutGoogle()">Use a different account</a>
      </div>

      <div class="back-link">
        <a href="index.html">&larr; Back to home</a>
      </div>
    </div>

    <div class="footer">Morning Chores App</div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC08HJ3Q8yitpJyTG28nhrWhZBv2s3YDwE",
  authDomain: "morning-chores-ee2f3.firebaseapp.com",
  projectId: "morning-chores-ee2f3",
  storageBucket: "morning-chores-ee2f3.firebasestorage.app",
  messagingSenderId: "374643848407",
  appId: "1:374643848407:web:642a57af25f97f037cec92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

function signInGoogle() {
  document.getElementById('signInError').classList.remove('visible');
  document.getElementById('signInSpinner').classList.add('visible');
  auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
}

function signOutGoogle() {
  localStorage.removeItem('familyId');
  auth.signOut();
}

async function findFamilyIdByEmail(email) {
  for (const e of [email, (email || '').toLowerCase()]) {
    if (!e) continue;
    const snap = await db.collection('families').where('parentEmail', '==', e).limit(1).get();
    if (!snap.empty) return snap.docs[0].id;
  }
  return null;
}

function showSignInError(msg) {
  const el = document.getElementById('signInError');
  el.textContent = msg;
  el.classList.add('visible');
  document.getElementById('signInSpinner').classList.remove('visible');
  document.getElementById('signInBtn').disabled = false;
  document.getElementById('switchAccount').style.display = 'inline-block';
}

auth.getRedirectResult().catch(e => showSignInError(e.message));

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    document.getElementById('signInSpinner').classList.remove('visible');
    return;
  }

  document.getElementById('signInSpinner').classList.add('visible');
  document.getElementById('signInBtn').disabled = true;

  try {
    const fid = await findFamilyIdByEmail(user.email);
    if (!fid) {
      showSignInError('No family found for ' + user.email + '. Ask a grown-up to sign in with the email used at signup.');
      return;
    }
    localStorage.setItem('familyId', fid);
    window.location.href = 'app.html?f=' + fid;
  } catch (e) {
    showSignInError('Something went wrong. Please try again.');
  }
});
</script>
</body>
</html>
