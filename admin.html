<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Admin Portal</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <style>
    :root { --primary: #667eea; --primary-dark: #764ba2; --green: #22c55e; --gold: #fbbf24; --red: #ef4444; }
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6; color: #1a1a2e; min-height: 100vh;
    }

    /* ===== PIN GATE ===== */
    #pinGate {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
      padding: 20px;
    }
    .pin-card {
      background: white; border-radius: 20px; padding: 32px;
      max-width: 340px; width: 100%; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .pin-card h2 { font-size: 22px; margin-bottom: 6px; }
    .pin-card p { color: #888; font-size: 13px; margin-bottom: 20px; }
    .pin-dots { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid #ccc; transition: all 0.2s;
    }
    .pin-dot.filled { background: #7c3aed; border-color: #7c3aed; }
    .pin-dot.error { background: var(--red); border-color: var(--red); }
    .pin-pad {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
      max-width: 240px; margin: 0 auto;
    }
    .pin-key {
      background: #f3f4f6; border: none; border-radius: 12px;
      padding: 14px; font-size: 20px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-key:active { background: #e5e7eb; }
    .pin-key.back { font-size: 16px; color: #888; }
    .pin-error { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }
    .google-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px 18px; margin-top: 8px;
      background: #7c3aed; color: white; border: none;
      border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .google-btn:active { background: #6d28d9; }
    .text-btn {
      margin-top: 14px; background: none; border: none; color: #888;
      font-size: 13px; text-decoration: underline; cursor: pointer;
    }

    /* ===== ADMIN DASHBOARD ===== */
    #dashboard { display: none; }
    .admin-header {
      background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
      color: white; padding: 20px 20px 24px;
    }
    .admin-header-top { display: flex; justify-content: space-between; align-items: center; }
    .admin-header h1 { font-size: 22px; }
    .family-count {
      background: rgba(255,255,255,0.2); border-radius: 20px;
      padding: 4px 14px; font-size: 13px; font-weight: 600;
    }

    .families-container { padding: 16px; }

    .family-card {
      background: white; border-radius: 16px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
    }
    .family-name { font-size: 20px; font-weight: 800; margin-bottom: 2px; }
    .family-parent { font-size: 13px; color: #888; margin-bottom: 14px; }

    .family-stats {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px;
    }
    .family-stat-box {
      background: #f3f4f6; border-radius: 10px; padding: 8px 6px; text-align: center;
    }
    .family-stat-val { font-size: 18px; font-weight: 800; }
    .family-stat-label { font-size: 10px; color: #888; margin-top: 2px; }

    .family-chore-list { margin-bottom: 14px; }
    .family-chore-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px;
    }
    .family-chore-item:last-child { border-bottom: none; }
    .family-chore-icon { font-size: 18px; }
    .family-chore-name { flex: 1; }
    .family-chore-status { font-size: 16px; }

    .family-meta { font-size: 12px; color: #aaa; margin-bottom: 12px; }

    .family-links { display: flex; gap: 8px; }
    .link-btn {
      flex: 1; text-align: center; padding: 8px 12px;
      border-radius: 10px; font-size: 13px; font-weight: 600;
      text-decoration: none; color: white;
    }
    .link-btn.parent-link { background: var(--primary); }
    .link-btn.kid-link { background: var(--green); }

    .loading-msg { text-align: center; color: #888; padding: 40px 20px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- GOOGLE AUTH GATE -->
  <div id="pinGate">
    <div class="pin-card">
      <h2>Admin Portal</h2>
      <p>Sign in with an authorized Google account</p>
      <button class="google-btn" onclick="signInGoogle()">Sign in with Google</button>
      <div class="pin-error" id="pinError"></div>
      <button class="text-btn" id="signOutBtn" style="display:none;" onclick="signOutGoogle()">Use a different account</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="admin-header">
      <div class="admin-header-top">
        <h1>Admin Portal</h1>
        <span class="family-count" id="familyCount">0 families</span>
      </div>
    </div>
    <div class="families-container" id="familiesContainer">
      <div class="loading-msg" id="loadingMsg">Loading families...</div>
    </div>
  </div>

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyC08HJ3Q8yitpJyTG28nhrWhZBv2s3YDwE",
  authDomain: "morning-chores-ee2f3.firebaseapp.com",
  projectId: "morning-chores-ee2f3",
  storageBucket: "morning-chores-ee2f3.firebasestorage.app",
  messagingSenderId: "374643848407",
  appId: "1:374643848407:web:642a57af25f97f037cec92"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const BASE_URL = 'https://garrettjockel-creator.github.io/morning-chores/';

// Google accounts allowed into the admin portal.
// EDIT THIS: replace with your own Google email(s), lowercase.
const ADMIN_EMAILS = ['garrett.jockel@gmail.com'];

const auth = firebase.auth();

function signInGoogle() {
  document.getElementById('pinError').style.display = 'none';
  auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
}

function signOutGoogle() {
  auth.signOut();
}

function showAuthError(msg) {
  const el = document.getElementById('pinError');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('signOutBtn').style.display = 'block';
}

auth.getRedirectResult().catch(e => showAuthError(e.message));

auth.onAuthStateChanged((user) => {
  if (!user) {
    document.getElementById('pinError').style.display = 'none';
    document.getElementById('signOutBtn').style.display = 'none';
    return;
  }
  const email = (user.email || '').toLowerCase();
  if (!ADMIN_EMAILS.map(e => e.toLowerCase()).includes(email)) {
    showAuthError((user.email || 'This account') + ' is not authorized for the admin portal.');
    return;
  }
  showDashboard();
});

// ===== DASHBOARD =====
function showDashboard() {
  document.getElementById('pinGate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadAllFamilies();
}

async function loadAllFamilies() {
  const container = document.getElementById('familiesContainer');

  let snap;
  try {
    snap = await db.collection('families').get();
  } catch (e) {
    const msg = e.code === 'permission-denied'
      ? 'Permission denied reading families. Firestore rules must allow listing the "families" collection.'
      : 'Failed to load families: ' + (e.message || e.code || e);
    document.getElementById('loadingMsg').innerHTML =
      '<div style="color:var(--red);font-weight:600;">' + escHtml(msg) + '</div>';
    return;
  }

  const count = snap.size;

  document.getElementById('familyCount').textContent = count + ' famil' + (count === 1 ? 'y' : 'ies');
  document.getElementById('loadingMsg').style.display = 'none';

  const today = new Date().toISOString().split('T')[0];

  snap.forEach(famDoc => {
    const fid = famDoc.id;
    const fam = famDoc.data();

    // Create placeholder card immediately
    const card = document.createElement('div');
    card.className = 'family-card';
    card.id = 'card-' + fid;
    card.innerHTML = '<div class="family-name">' + escHtml(fam.childName || 'Unnamed') + '</div>' +
      '<div class="family-parent">' + escHtml(fam.parentName || '') +
      (fam.email ? ' &middot; ' + escHtml(fam.email) : '') + '</div>' +
      '<div class="loading-msg" style="padding:10px 0;">Loading data...</div>';
    container.appendChild(card);

    // Load subcollections in parallel
    loadFamilyData(fid, fam, today);
  });
}

async function loadFamilyData(fid, fam, today) {
  const famRef = db.collection('families').doc(fid);

  const [profileDoc, choresSnap, compDoc] = await Promise.all([
    famRef.collection('profile').doc('main').get(),
    famRef.collection('chores').orderBy('order').get(),
    famRef.collection('completions').doc(today).get(),
  ]);

  const profile = profileDoc.exists ? profileDoc.data() : { xp: 0, streak: 0 };
  const chores = choresSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const activeChores = chores.filter(c => c.active !== false);
  const doneToday = compDoc.exists && compDoc.data().done ? compDoc.data().done : [];

  renderFamilyCard(fid, fam, profile, activeChores, doneToday);
}

function renderFamilyCard(fid, fam, profile, chores, doneToday) {
  const card = document.getElementById('card-' + fid);
  if (!card) return;

  const xp = profile.xp || 0;
  const streak = profile.streak || 0;
  const doneCount = doneToday.length;
  const totalCount = chores.length;

  const theme = fam.theme || 'default';
  const created = fam.createdAt ? new Date(fam.createdAt.seconds * 1000).toLocaleDateString() : '—';
  const onboarded = fam.onboardingComplete ? 'Yes' : 'No';

  let choreListHtml = '';
  if (chores.length > 0) {
    choreListHtml = '<div class="family-chore-list">' +
      chores.map(c => {
        const isDone = doneToday.includes(c.id);
        return '<div class="family-chore-item">' +
          '<span class="family-chore-icon">' + (c.icon || '📋') + '</span>' +
          '<span class="family-chore-name">' + escHtml(c.title) + '</span>' +
          '<span class="family-chore-status">' + (isDone ? '✅' : '⬜') + '</span>' +
          '</div>';
      }).join('') + '</div>';
  }

  card.innerHTML =
    '<div class="family-name">' + escHtml(fam.childName || 'Unnamed') + '</div>' +
    '<div class="family-parent">' + escHtml(fam.parentName || '') +
      (fam.email ? ' &middot; ' + escHtml(fam.email) : '') + '</div>' +

    '<div class="family-stats">' +
      '<div class="family-stat-box"><div class="family-stat-val">' + streak + '</div><div class="family-stat-label">Streak</div></div>' +
      '<div class="family-stat-box"><div class="family-stat-val">' + xp + ' pts</div><div class="family-stat-label">Total Pts</div></div>' +
      '<div class="family-stat-box"><div class="family-stat-val">' + doneCount + '/' + totalCount + '</div><div class="family-stat-label">Today</div></div>' +
    '</div>' +

    choreListHtml +

    '<div class="family-meta">Theme: ' + escHtml(theme) + ' &middot; Created: ' + created + ' &middot; Onboarded: ' + onboarded + '</div>' +

    '<div class="family-links">' +
      '<a class="link-btn parent-link" href="' + BASE_URL + 'parent.html?f=' + fid + '" target="_blank">Parent Dashboard</a>' +
      '<a class="link-btn kid-link" href="' + BASE_URL + 'app.html?f=' + fid + '" target="_blank">Kid App</a>' +
    '</div>';
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
